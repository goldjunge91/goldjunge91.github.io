<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern GitHub Portfolio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-500">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-black flex items-center justify-center z-50">
      <canvas id="loading-canvas" class="w-full h-full"></canvas>
      <div class="absolute text-white text-3xl animate-glitch">Loading...</div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden relative h-screen w-full overflow-hidden">
      <!-- 3D Sternenhimmel Canvas -->
      <canvas id="starfield-canvas" class="absolute inset-0"></canvas>

      <!-- UI Buttons als Sterne -->
      <div class="absolute inset-0 flex flex-col items-center justify-center space-y-4">
        <button id="btn-about" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-full shadow-lg">💫 Über mich</button>
        <button id="btn-skills" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-full shadow-lg">🚀 Skills</button>
        <button id="btn-projects" class="bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded-full shadow-lg">🌌 Projekte</button>
        <button id="btn-contact" class="bg-yellow-500 hover:bg-yellow-600 text-white py-2 px-4 rounded-full shadow-lg">📬 Kontakt</button>
      </div>

      <!-- Dark Mode Toggle -->
      <button id="dark-mode-toggle" class="absolute top-4 right-4 bg-gray-200 dark:bg-gray-800 rounded-full p-2 text-xl focus:outline-none">
        🌓
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
